<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>HLS Test</title>
<style>
body { background: #0b0b10; color: #f5f5f7; font-family: Inter, sans-serif; padding: 40px; }
video { width: 100%; max-width: 900px; display: block; border-radius: 10px; }
input { width: 100%; max-width: 900px; padding: 10px; background: #16161e; border: 1px solid #26262f; color: #f5f5f7; border-radius: 8px; margin-bottom: 16px; font-size: 13px; }
button { padding: 10px 20px; background: #e01552; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; margin-bottom: 24px; }
</style>
</head>
<body>
<h2>HLS Player Test</h2>
<input id="url" type="text" placeholder="Paste m3u8 URL here" />
<button onclick="load()">Load</button>
<video id="video" controls></video>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
function load() {
  const src = document.getElementById('url').value.trim();
  const video = document.getElementById('video');
  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(src);
    hls.attachMedia(video);
    video.play();
  } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
    video.src = src;
    video.play();
  }
}
</script>
</body>
</html>
